server:
  port: 8085
spring:
  application:
    name: API-GATEWAY-SERVICE
  cloud:
    gateway:
      httpclient:
        wiretap: true
        uri-encoding: UTF-8
        strict-uri-validation: false
      routes:
        - id: api_v1
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/**
        - id: default
          uri: http://localhost:3000
          predicates:
            - Path=/**

config:
  rateLimited:
    enabled: true
    enableDistributedMode: false
    algorithm: tokenBucket
    strategy: drop
    rules:
      - id: api_rate_limiting_rule
        algorithm: tokenBucket
        config:
          tokenBucket:
            capacity: 10
            refillRate: 2
            refillUnit: S
        resourcePath: /api/v1/**
        limitBy:
          - ip
  protectedRoutes:
    enabled: false
    routes:
      - id: console
        path: /console/**